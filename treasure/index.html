<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>宝箱</title>
  <meta name="description" content="リアルでポップな宝箱。タップするとフタが開いて、金貨と宝石があふれ出します。">
  <meta name="theme-color" content="#BFE3F2">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='13' width='24' height='14' rx='2' fill='%23C8772F'/%3E%3Cpath d='M4 14a12 9 0 0 1 24 0z' fill='%23D98A3D'/%3E%3Crect x='4' y='13' width='24' height='3' fill='%23E8B34A'/%3E%3Crect x='13.5' y='14' width='5' height='7' rx='1.5' fill='%23E8B34A'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
  <link rel="stylesheet" href="./src/ui/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <canvas id="view" aria-label="宝箱。タップでフタが開きます。ドラッグで視点を回せます。"></canvas>

  <div id="loading" class="loading" role="status">
    <div class="coin-spin" aria-hidden="true"></div>
    <p>宝箱を用意しています</p>
  </div>

  <div id="error" class="error" hidden role="alert">
    <p class="error-title">表示できませんでした</p>
    <p class="error-message"></p>
  </div>

  <header class="top">
    <a class="back" href="../" title="作品一覧へ戻る" aria-label="作品一覧へ戻る">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5L7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <h1 class="logo">TREASURE<span>宝箱</span></h1>
  </header>

  <nav id="grounds" class="grounds" aria-label="地面"></nav>

  <button id="hint" class="hint" type="button">タップして開ける</button>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
