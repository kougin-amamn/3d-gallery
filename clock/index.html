<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>機械式時計</title>
  <meta name="description" content="機械式時計のムーブメントを3Dで。てんぷとガンギ車が実際の時刻に合わせて1秒8振動で動きます。">
  <meta name="theme-color" content="#0B0908">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230B0908'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23E6B464' stroke-width='2'/%3E%3Cpath d='M16 6v20M6 16h20' stroke='%23E6B464' stroke-width='1.4'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500&display=swap">
  <link rel="stylesheet" href="./src/ui/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <canvas id="view" aria-label="機械式時計のムーブメント。ドラッグで視点を回し、ホイールで拡大できます。"></canvas>

  <div id="loading" class="loading" role="status">
    <div class="loading-inner">
      <div class="spinner" aria-hidden="true"></div>
      <p class="loading-text">部品を組み立てています</p>
    </div>
  </div>

  <div id="error" class="error" hidden role="alert">
    <p class="error-title">表示できませんでした</p>
    <p class="error-message"></p>
  </div>

  <header class="top">
    <div class="brand">
      <a class="back" href="../" title="作品一覧へ戻る" aria-label="作品一覧へ戻る">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5L7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </a>
      <span class="brand-en">Mechanical Movement</span>
      <span class="brand-ja">機械式時計</span>
      <span class="badge">v0.1</span>
    </div>
    <div class="readout" aria-live="off">
      <span class="time" id="time">--:--:--</span>
      <span class="spec">28,800 振動/時 · 4 Hz</span>
    </div>
  </header>

  <div id="labels" class="labels"></div>

  <aside class="info">
    <h2 id="info-title"></h2>
    <p id="info-text"></p>
  </aside>

  <nav class="bar" aria-label="操作">
    <div class="seg" id="views" role="group" aria-label="視点"></div>
    <div class="seg"><button type="button" id="explode" aria-pressed="false" title="分解表示(E)">分解</button></div>
    <div class="seg" id="speeds" role="group" aria-label="速さ"></div>
  </nav>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
