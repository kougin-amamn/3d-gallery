<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>太陽系ビューア</title>
  <meta name="description" content="実際の暦で動く3D太陽系。惑星の位置は今日の日付で計算され、天体を選んで飛んでいけます。">
  <meta name="theme-color" content="#03050A">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2303050A'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23FFB46B'/%3E%3Cellipse cx='16' cy='16' rx='11' ry='4.5' fill='none' stroke='%23D8E1EA' stroke-width='1'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;600&family=Saira+Condensed:wght@500;600&display=swap">
  <link rel="stylesheet" href="./src/ui/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <canvas id="view" aria-label="3D太陽系。ドラッグで視点を回し、天体をクリックするとその天体へ移動します。"></canvas>
  <div id="labels" class="labels" aria-hidden="true"></div>

  <div id="loading" class="loading" role="status">
    <div class="loading-inner">
      <div class="orbit-spinner" aria-hidden="true"><span></span></div>
      <p class="loading-text" id="loading-text">軌道を計算しています</p>
    </div>
  </div>

  <div id="error" class="error" hidden role="alert">
    <p class="error-title">表示できませんでした</p>
    <p class="error-message"></p>
  </div>

  <header class="top" id="top">
    <div class="brand">
      <a class="back" href="../" title="作品一覧へ戻る" aria-label="作品一覧へ戻る">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5L7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </a>
      <span class="brand-en">SOLAR SYSTEM</span>
      <span class="brand-ja">太陽系ビューア</span>
    </div>
    <p class="mode" id="mode-note">見やすい表示:距離と大きさは実際と異なります</p>
  </header>

  <aside class="panel" id="panel" aria-live="polite">
    <div class="panel-head">
      <p class="panel-type" id="p-type">恒星</p>
      <h2 class="panel-name"><span id="p-name">太陽</span><span class="panel-en" id="p-en">Sun</span></h2>
    </div>
    <dl class="facts" id="p-facts"></dl>
    <p class="panel-desc" id="p-desc"></p>
  </aside>

  <nav class="bar" id="bar" aria-label="操作">
    <div class="bar-row bodies" id="bodies" role="toolbar" aria-label="天体を選ぶ"></div>
    <div class="bar-row controls">
      <div class="group time" role="group" aria-label="時間">
        <button class="icon" id="t-slower" title="遅く / 逆向き([)" aria-label="遅く">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M9 5L3 10l6 5zM17 5l-6 5 6 5z"/></svg>
        </button>
        <button class="icon" id="t-toggle" title="一時停止 / 再生(スペース)" aria-label="一時停止">
          <svg viewBox="0 0 20 20" aria-hidden="true" class="i-pause"><rect x="5" y="4" width="3.2" height="12" rx="1"/><rect x="11.8" y="4" width="3.2" height="12" rx="1"/></svg>
          <svg viewBox="0 0 20 20" aria-hidden="true" class="i-play"><path d="M6 4l10 6-10 6z"/></svg>
        </button>
        <button class="icon" id="t-faster" title="速く(])" aria-label="速く">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M11 5l6 5-6 5zM3 5l6 5-6 5z"/></svg>
        </button>
        <span class="speed" id="t-speed">1時間/秒</span>
      </div>
      <div class="group date">
        <label class="sr-only" for="t-date">日時</label>
        <input id="t-date" type="datetime-local" step="60">
        <button class="text" id="t-now" title="現在の日時に戻す">今</button>
      </div>
      <div class="group seg" role="radiogroup" aria-label="表示スケール" id="scale">
        <button role="radio" data-scale="0" aria-checked="true">見やすい</button>
        <button role="radio" data-scale="1" aria-checked="false">実寸</button>
      </div>
      <div class="group toggles">
        <button class="text toggle" id="tg-orbits" aria-pressed="true">軌道</button>
        <button class="text toggle" id="tg-labels" aria-pressed="true">名前</button>
        <label class="sr-only" for="quality">画質</label>
        <select id="quality">
          <option value="auto">画質 自動</option>
          <option value="low">画質 低</option>
          <option value="medium">画質 中</option>
          <option value="high">画質 高</option>
        </select>
        <button class="icon" id="fullscreen" title="全画面" aria-label="全画面">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8V3h5M17 8V3h-5M3 12v5h5M17 12v5h-5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <p class="credits" id="credits">
    地球の画像: <a href="https://www.solarsystemscope.com/textures/" target="_blank" rel="noopener">Solar System Scope</a>(CC BY 4.0)·
    恒星: Yale Bright Star Catalog(HEASARC)·
    軌道: <a href="https://ssd.jpl.nasa.gov/planets/approx_pos.html" target="_blank" rel="noopener">JPL</a>·
    その他の天体の地表は手続き生成
  </p>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
