<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>静かな水槽</title>
  <meta name="description" content="ブラウザで眺める3Dアクアリウム。光と水と魚の動きだけで見入る、静かな水槽。">
  <meta name="theme-color" content="#0B3A53">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230B3A53'/%3E%3Cpath d='M7 17c4-6 11-6 14 0-3 6-10 6-14 0zm14 0l5-4v8z' fill='%237FD8E0'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./src/ui/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <canvas id="view" aria-label="3Dアクアリウム"></canvas>

  <div id="loading" class="loading" role="status">
    <div class="loading-inner">
      <div class="ripple" aria-hidden="true"><span></span><span></span></div>
      <p class="loading-text">水を張っています…</p>
    </div>
  </div>

  <div id="error" class="error" hidden role="alert">
    <p class="error-title">表示できませんでした</p>
    <p class="error-message"></p>
  </div>

  <div id="title" class="title" aria-hidden="true">
    <span class="title-main">AQUARIUM</span>
    <span class="title-sub">静かな水槽</span>
  </div>

  <nav id="hud" class="hud" aria-label="操作">
    <a class="hud-btn icon-only" href="../" title="作品一覧へ戻る">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke-width="1.8"/></svg>
      <span class="sr-only">作品一覧へ戻る</span>
    </a>
    <div class="hud-sep" aria-hidden="true"></div>
    <button class="hud-btn" data-act="feed" title="餌やり (F)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="7" r="1.6"/><circle cx="14" cy="5" r="1.3"/><circle cx="12" cy="11" r="1.5"/><circle cx="17" cy="10" r="1.2"/><circle cx="9" cy="15" r="1.3"/><path d="M4 20c3-2 13-2 16 0" fill="none" stroke-width="1.6"/></svg>
      <span>餌やり</span>
    </button>
    <div class="hud-sep" aria-hidden="true"></div>
    <div class="hud-seg" role="radiogroup" aria-label="時間帯" data-group="time">
      <button role="radio" data-value="morning">朝</button>
      <button role="radio" data-value="day">昼</button>
      <button role="radio" data-value="night">夜</button>
    </div>
    <div class="hud-sep" aria-hidden="true"></div>
    <label class="hud-select">
      <span class="sr-only">画質</span>
      <select data-act="quality" aria-label="画質">
        <option value="auto">画質 自動</option>
        <option value="low">画質 低</option>
        <option value="medium">画質 中</option>
        <option value="high">画質 高</option>
      </select>
    </label>
    <button class="hud-btn icon-only" data-act="fullscreen" title="全画面">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke-width="1.8"/></svg>
      <span class="sr-only">全画面</span>
    </button>
  </nav>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
